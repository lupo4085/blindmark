[package]
name = "blindmark"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "system_fonts", "accesskit", "clipboard"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "rayon"] }
rayon = "1.12.0"
rfd = "0.17.2"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[[bin]]
name = "blindmark"
path = "src/main.rs"

[[bin]]
name = "blindmark-cli"
path = "src/bin/cli.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 2
