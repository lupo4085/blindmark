name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            ext: .exe
          - os: macos-latest
            name: macos-arm64
            ext: ""
          - os: ubuntu-latest
            name: linux-x64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --release --lib
      - name: Build
        run: cargo build --release --bins
      - name: Package
        shell: bash
        run: |
          mkdir dist
          # The graphical app is Windows-only; other platforms ship the command-line tool.
          if [ "${{ runner.os }}" = "Windows" ]; then cp target/release/blindmark.exe dist/; fi
          cp target/release/blindmark-cli${{ matrix.ext }} dist/
          cp LICENSE-MIT LICENSE-APACHE dist/
          cp README.md dist/
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "blindmark-${{ matrix.name }}.zip" ./dist/*
          else
            tar czf "blindmark-${{ matrix.name }}.tar.gz" -C dist .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: blindmark-${{ matrix.name }}
          path: dist/
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: blindmark-${{ matrix.name }}.*
